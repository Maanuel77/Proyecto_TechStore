spring.application.name=TechStore
server.port=9000

spring.datasource.url=jdbc:h2:./db/basededatos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Datos iniciales en import.sql (los carga Hibernate al crear el esquema).
# Por defecto Hibernate usa un parser de una sentencia por linea; el
# extractor multilinea permite escribir INSERTs con varias filas en VALUES.
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor

# Fuerza acceso a relaciones lazy SIEMPRE dentro de transaccion: si una vista
# necesita una relacion lazy, se carga con JOIN FETCH en la query, no a deshora.
spring.jpa.open-in-view=false

# http://localhost:9000/h2-console
spring.h2.console.enabled=true

spring.jpa.show-sql=true

# =====================================================================
# JavaMail (Gmail SMTP). Para enviar los codigos de verificacion 2FA.
# "App Password" cuenta de Gmail
# =====================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=EMAIL
spring.mail.password=PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Nombre y direccion visibles en el email.
techstore.mail.from=EMAIL
techstore.mail.from-name=TechStore
