spring.application.name=TechStore
server.port=9000

# Por defecto arrancamos en perfil "dev" (h2-console, show-sql, logs verbosos).
# Para produccion: -Dspring.profiles.active=prod
spring.profiles.active=dev

spring.datasource.url=jdbc:h2:./db/basededatos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Fuerza acceso a relaciones lazy SIEMPRE dentro de transaccion: si una vista
# necesita una relacion lazy, se carga con JOIN FETCH en la query, no a deshora.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor

# JavaMail (Gmail SMTP). Para enviar los codigos de verificacion 2FA.
#
# Las credenciales reales se cargan desde variables de entorno
# (EMAIL_USERNAME y EMAIL_PASSWORD) para no commitearlas. Si no estan
# definidas, se usan los valores por defecto: la app arranca pero el envio
# de email FALLARA. En perfil dev (techstore.mail.log-code=true) el codigo
# se imprime por consola para que igualmente puedas probar el flujo 2FA.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Direccion "from" y nombre mostrado del remitente.
techstore.mail.from=${EMAIL_USERNAME:noreply@techstore.local}
techstore.mail.from-name=TechStore
