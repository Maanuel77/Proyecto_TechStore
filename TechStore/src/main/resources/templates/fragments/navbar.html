<!-- Navbar global. Los enlaces se muestran según el rol del usuario logueado
     gracias a sec:authorize (Spring Security extras de Thymeleaf). -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:fragment="navbar">

<body>
	<nav class="navbar navbar-expand-lg sticky-top border-bottom ts-navbar-blur">
		<div class="container">
			<a class="navbar-brand fw-bold" th:href="@{/}">TechStore</a>

			<button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
				data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Abrir menú">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navMain">
				<ul class="navbar-nav mx-auto gap-lg-1 py-2 py-lg-0">
					<li class="nav-item">
						<a class="nav-link text-secondary" th:href="@{/}">Inicio</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-secondary" th:href="@{/catalogo}">Catálogo</a>
					</li>
					<!-- Carrito con badge de cantidad (lo inyecta GlobalModelAdvice). -->
					<li class="nav-item" sec:authorize="hasRole('CLIENTE')">
						<a class="nav-link text-secondary position-relative" th:href="@{/carrito}">
							<i class="bi bi-bag me-1"></i>Carrito
							<span class="badge rounded-pill bg-dark position-absolute top-0 start-100 translate-middle"
								th:if="${cantidad_carrito != null and cantidad_carrito > 0}"
								th:text="${cantidad_carrito}"
								style="font-size: 0.65rem;"></span>
						</a>
					</li>
					<li class="nav-item" sec:authorize="hasRole('CLIENTE')">
						<a class="nav-link text-secondary" th:href="@{/pedidos}">
							<i class="bi bi-clock-history me-1"></i>Mis pedidos
						</a>
					</li>
					<li class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a class="nav-link text-secondary" th:href="@{/admin/dashboard}">
							<i class="bi bi-grid me-1"></i>Admin
						</a>
					</li>
				</ul>

				<div class="d-flex align-items-center gap-2 flex-wrap py-2 py-lg-0">
					<span class="text-muted small" sec:authorize="isAuthenticated()">
						<i class="bi bi-person-circle me-1"></i>
						<span sec:authentication="name"></span>
					</span>
					<a th:href="@{/perfil}" class="btn btn-outline-secondary btn-sm rounded-pill"
					   sec:authorize="isAuthenticated()">
						<i class="bi bi-person me-1"></i>Mi perfil
					</a>
					<form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="m-0">
						<button type="submit" class="btn btn-outline-dark btn-sm rounded-pill">
							Cerrar sesión
						</button>
					</form>
					<a th:href="@{/auth/login}" class="btn btn-dark btn-sm rounded-pill"
						sec:authorize="!isAuthenticated()">
						Iniciar sesión
					</a>
				</div>
			</div>
		</div>
	</nav>
</body>

</html>
