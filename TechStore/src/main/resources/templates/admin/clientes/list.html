<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Clientes — TechStore Admin', null)}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <div class="bg-white border-bottom py-4 mb-4">
            <div class="container d-flex align-items-center justify-content-between">
                <div>
                    <h1 class="fw-bold fs-3 mb-0">Clientes</h1>
                    <p class="text-muted small mb-0">Gestiona los usuarios registrados y sus roles</p>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill">
                    <i class="bi bi-arrow-left me-1"></i>Volver al dashboard
                </a>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="container pb-5">

            <div class="card border-0 shadow-sm rounded-4 p-5 text-center text-muted"
                 th:if="${usuarios.isEmpty()}">
                <i class="bi bi-people fs-1 mb-3 d-block"></i>
                <p class="mb-0">Todavía no hay usuarios registrados.</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden"
                 th:if="${!usuarios.isEmpty()}">

                <div class="d-flex align-items-center justify-content-between px-4 py-3 border-bottom">
                    <h5 class="mb-0 fw-semibold">Listado de clientes</h5>
                    <span class="badge bg-dark rounded-pill"
                          th:text="${usuarios.size()} + ' usuarios'"></span>
                </div>

                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ts-th px-4">#</th>
                            <th class="ts-th">Usuario</th>
                            <th class="ts-th">Nombre completo</th>
                            <th class="ts-th">Email</th>
                            <th class="ts-th">Teléfono</th>
                            <th class="ts-th">Rol</th>
                            <th class="ts-th text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td class="px-4 text-muted small" th:text="${u.id}"></td>
                            <td class="fw-semibold" th:text="${u.username}"></td>
                            <td th:text="${u.fullname}"></td>
                            <td>
                                <a th:href="'mailto:' + ${u.email}"
                                   class="text-decoration-none text-muted small"
                                   th:text="${u.email}"></a>
                            </td>
                            <td class="text-muted small" th:text="${u.telefono}"></td>
                            <td>
                                <!-- Badge especial para el superadmin -->
                                <span th:if="${u.superadmin}"
                                      class="badge rounded-pill bg-warning text-dark">
                                    <i class="bi bi-shield-fill-check me-1"></i>SUPERADMIN
                                </span>
                                <span th:if="${!u.superadmin}"
                                      class="badge rounded-pill"
                                      th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-dark text-white' : 'bg-primary-subtle text-primary-emphasis'"
                                      th:text="${u.role.name()}"></span>
                            </td>
                            <td class="text-end pe-4">
                                <!-- 1. El superadmin es intocable -->
                                <span th:if="${u.superadmin}"
                                      class="text-warning-emphasis small fst-italic">
                                    <i class="bi bi-lock-fill me-1"></i>Protegido
                                </span>
                                <!-- 2. No mostramos el botón en el usuario logueado para que no se autodemote -->
                                <span th:if="${!u.superadmin and u.username == #authentication.name}"
                                      class="text-muted small fst-italic">Tú mismo</span>
                                <!-- 3. El resto sí se pueden togglear -->
                                <a th:if="${!u.superadmin and u.username != #authentication.name}"
                                   th:href="@{/admin/clientes/toggle-role/{id}(id=${u.id})}"
                                   class="btn btn-sm rounded-pill"
                                   th:classappend="${u.role.name() == 'ADMIN'} ? 'btn-outline-danger' : 'btn-outline-success'"
                                   th:text="${u.role.name() == 'ADMIN'} ? 'Quitar admin' : 'Hacer admin'"></a>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
