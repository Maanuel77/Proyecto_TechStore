<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Nuevo producto — TechStore Admin', null)}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <div class="bg-white border-bottom py-4 mb-4">
            <div class="container d-flex align-items-center justify-content-between">
                <div>
                    <h1 class="fw-bold fs-3 mb-0">Nuevo producto</h1>
                    <p class="text-muted small mb-0">Panel de administración · TechStore</p>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill">
                    <i class="bi bi-arrow-left me-1"></i>Volver
                </a>
            </div>
        </div>

        <div class="container pb-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mx-auto" style="max-width: 640px;">

                <form th:action="@{/admin/producto/nuevo}" th:object="${producto}" method="post">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Marca</label>
                        <input type="text" class="form-control" th:field="*{marca}" required />
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label fw-semibold">Precio (€)</label>
                            <input type="number" class="form-control" th:field="*{precio}"
                                   step="0.01" min="0" required />
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-semibold">Stock (uds.)</label>
                            <input type="number" class="form-control" th:field="*{stock}"
                                   min="0" required />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Garantía (meses)</label>
                        <input type="number" class="form-control" th:field="*{garantiaMeses}"
                               min="0" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">URL de imagen</label>
                        <input type="url" class="form-control" th:field="*{imagenUrl}"
                               placeholder="https://..." />
                    </div>

                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   th:field="*{refurbished}" id="refurbished" />
                            <label class="form-check-label" for="refurbished">
                                Producto reacondicionado
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark rounded-pill w-100 py-2">
                        <i class="bi bi-plus-lg me-1"></i>Guardar producto
                    </button>

                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
