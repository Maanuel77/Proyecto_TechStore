<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Productos archivados — TechStore Admin', null)}"></head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<main>
		<div class="bg-white border-bottom py-4 mb-4">
			<div class="container d-flex align-items-center justify-content-between">
				<div>
					<h1 class="fw-bold fs-3 mb-0">Productos archivados</h1>
					<p class="text-muted small mb-0">
						Productos retirados del catálogo. No se muestran en la tienda, pero
						siguen vinculados a los pedidos antiguos para preservar el histórico.
					</p>
				</div>
				<div class="d-flex gap-2 flex-wrap">
					<a th:href="@{/admin/productos}" class="btn btn-outline-secondary btn-sm rounded-pill">
						<i class="bi bi-arrow-left me-1"></i>Volver a productos
					</a>
				</div>
			</div>
		</div>

		<div class="container pb-5">

			<!-- Flash message tras restaurar. -->
			<div class="alert alert-success border-0 rounded-3 small py-2 mb-3"
			     th:if="${infoProducto}">
				<i class="bi bi-check-circle me-1"></i>
				<span th:text="${infoProducto}"></span>
			</div>

			<!-- Empty state -->
			<div class="card border-0 shadow-sm rounded-4 p-5 text-center text-muted"
			     th:if="${productos.isEmpty()}">
				<i class="bi bi-archive fs-1 mb-3 d-block"></i>
				<p class="mb-0">No hay ningún producto archivado.</p>
			</div>

			<!-- Grid de tarjetas con acción restaurar -->
			<div class="row g-4" th:if="${!productos.isEmpty()}">
				<div class="col-sm-6 col-lg-4" th:each="p : ${productos}">
					<div class="card border-0 shadow-sm rounded-4 h-100 ts-hover" style="opacity: .85;">

						<div class="ratio ratio-4x3 bg-light overflow-hidden rounded-top-4 position-relative">
							<img th:if="${p.imagenUrl != null}" class="object-fit-contain p-3"
							     th:src="${p.imagenUrl}" th:alt="${p.nombre}" loading="lazy"
							     style="filter: grayscale(.6);" />
							<div class="ts-img-placeholder d-flex align-items-center justify-content-center"
							     th:if="${p.imagenUrl == null}">
								<i class="bi bi-box-seam fs-1 opacity-50"></i>
							</div>
							<span class="badge bg-secondary position-absolute top-0 end-0 m-2 rounded-pill">
								<i class="bi bi-archive me-1"></i>Archivado
							</span>
						</div>

						<div class="card-body d-flex flex-column p-4">
							<div class="small text-muted text-uppercase fw-semibold mb-1 ts-label-sm"
							     th:text="${p.marca}"></div>
							<div class="fw-semibold mb-2 flex-grow-1" th:text="${p.nombre}"></div>

							<div class="fw-bold fs-5 mb-3"
							     th:text="${#numbers.formatDecimal(p.precio,1,'POINT',2,'COMMA')} + ' €'"></div>

							<!-- Acciones admin -->
							<div class="d-flex gap-2 mt-auto">
								<a th:href="@{/admin/producto/restaurar/{id}(id=${p.id})}"
								   class="btn btn-outline-success btn-sm rounded-pill flex-fill"
								   onclick="return confirm('¿Restaurar este producto? Volverá a aparecer en el catálogo público.');">
									<i class="bi bi-arrow-counterclockwise me-1"></i>Restaurar
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
