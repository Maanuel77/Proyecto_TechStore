<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Productos — TechStore Admin', null)}"></head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<main>
		<div class="bg-white border-bottom py-4 mb-4">
			<div class="container d-flex align-items-center justify-content-between">
				<div>
					<h1 class="fw-bold fs-3 mb-0">Productos</h1>
					<p class="text-muted small mb-0">Edita o elimina productos del catálogo</p>
				</div>
				<div class="d-flex gap-2">
					<a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill">
						<i class="bi bi-arrow-left me-1"></i>Volver al dashboard
					</a>
					<a th:href="@{/admin/producto/nuevo}" class="btn btn-dark btn-sm rounded-pill">
						<i class="bi bi-plus-lg me-1"></i>Añadir producto
					</a>
				</div>
			</div>
		</div>

		<div class="container pb-5">

			<!-- Empty state -->
			<div class="card border-0 shadow-sm rounded-4 p-5 text-center text-muted"
			     th:if="${productos.isEmpty()}">
				<i class="bi bi-box-seam fs-1 mb-3 d-block"></i>
				<p class="mb-0">Todavía no hay productos registrados.</p>
			</div>

			<!-- Grid de tarjetas con acciones editar/eliminar -->
			<div class="row g-4" th:if="${!productos.isEmpty()}">
				<div class="col-sm-6 col-lg-4" th:each="p : ${productos}">
					<div class="card border-0 shadow-sm rounded-4 h-100 ts-hover">

						<div class="ratio ratio-4x3 bg-light overflow-hidden rounded-top-4">
							<img th:if="${p.imagenUrl != null}" class="object-fit-contain p-3"
							     th:src="${p.imagenUrl}" th:alt="${p.nombre}" loading="lazy" />
							<div class="ts-img-placeholder d-flex align-items-center justify-content-center"
							     th:if="${p.imagenUrl == null}">
								<i class="bi bi-box-seam fs-1 opacity-50"></i>
							</div>
						</div>

						<div class="card-body d-flex flex-column p-4">
							<div class="small text-muted text-uppercase fw-semibold mb-1 ts-label-sm"
							     th:text="${p.marca}"></div>
							<div class="fw-semibold mb-2 flex-grow-1" th:text="${p.nombre}"></div>

							<!-- Badges con colores según stock -->
							<div class="d-flex flex-wrap gap-1 mb-2">
								<span class="badge rounded-pill bg-primary-subtle text-primary-emphasis"
								      th:if="${p.refurbished}">Reacondicionado</span>
								<span class="badge rounded-pill bg-success-subtle text-success-emphasis"
								      th:if="${p.nivelStock.name() == 'DISPONIBLE'}">
									En stock (<span th:text="${p.stock}"></span>)
								</span>
								<span class="badge rounded-pill bg-warning-subtle text-warning-emphasis"
								      th:if="${p.nivelStock.name() == 'BAJO'}">
									Pocas (<span th:text="${p.stock}"></span>)
								</span>
								<span class="badge rounded-pill bg-danger-subtle text-danger-emphasis"
								      th:if="${p.nivelStock.name() == 'AGOTADO'}">Agotado</span>
							</div>

							<div class="d-flex align-items-center gap-1 mb-3">
								<i class="bi bi-patch-check small text-muted"></i>
								<span class="text-muted small">
									Garantía <span th:text="${p.garantiaMeses}"></span> meses
								</span>
							</div>

							<div class="fw-bold fs-5 mb-3"
							     th:text="${#numbers.formatDecimal(p.precio,1,'POINT',2,'COMMA')} + ' €'"></div>

							<!-- Acciones admin -->
							<div class="d-flex gap-2 mt-auto">
								<a th:href="@{/admin/producto/editar/{id}(id=${p.id})}"
								   class="btn btn-outline-secondary btn-sm rounded-pill flex-fill">
									<i class="bi bi-pencil me-1"></i>Editar
								</a>
								<a th:href="@{/admin/producto/eliminar/{id}(id=${p.id})}"
								   class="btn btn-outline-danger btn-sm rounded-pill flex-fill"
								   onclick="return confirm('¿Eliminar este producto? Esta acción no se puede deshacer.');">
									<i class="bi bi-trash me-1"></i>Eliminar
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
