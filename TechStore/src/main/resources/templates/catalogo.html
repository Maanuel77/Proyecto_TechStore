<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Catálogo — TechStore', null)}"></head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<main>
		<div class="bg-white border-bottom py-4 mb-4">
			<div class="container">
				<h1 class="fw-bold mb-1">Catálogo</h1>
				<p class="text-muted mb-0" th:text="${productos.size()} + ' productos disponibles'"></p>
			</div>
		</div>

		<div th:replace="~{fragments/alerts :: alerts}"></div>

		<div class="container pb-5">
			<!-- Buscador (filtro por nombre/marca con JS en el cliente) -->
			<div class="card border-0 shadow-sm rounded-3 px-3 py-2 mb-4
                    d-flex flex-row align-items-center gap-2">
				<i class="bi bi-search text-muted"></i>
				<input type="text" id="searchInput" class="form-control border-0 shadow-none bg-transparent"
					placeholder="Buscar por nombre o marca…" autocomplete="off" />
				<span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill" id="resultCount"
					th:text="${productos.size()} + ' resultados'"></span>
			</div>

			<!-- Grid de tarjetas de producto. Cada tarjeta abre un modal de detalle. -->
			<div class="row g-4" id="productGrid">
				<div class="col-sm-6 col-lg-4" th:each="p : ${productos}"
					th:attr="data-search=${#strings.toLowerCase(p.nombre + ' ' + p.marca)}">
					<div class="card border-0 shadow-sm rounded-4 h-100 ts-hover ts-card-clickable"
						 data-bs-toggle="modal"
						 data-bs-target="#productoModal"
						 th:data-id="${p.id}"
						 th:data-nombre="${p.nombre}"
						 th:data-marca="${p.marca}"
						 th:data-precio="${p.precio}"
						 th:data-stock="${p.stock}"
						 th:data-nivel="${p.nivelStock.name()}"
						 th:data-garantia="${p.garantiaMeses}"
						 th:data-refurbished="${p.refurbished}"
						 th:data-imagen="${p.imagenUrl}"
						 style="cursor: pointer;">
						<div class="ratio ratio-4x3 bg-light overflow-hidden rounded-top-4">
							<img th:if="${p.imagenUrl != null}" class="object-fit-contain p-3" th:src="${p.imagenUrl}"
								th:alt="${p.nombre}" loading="lazy" />
							<div class="ts-img-placeholder d-flex align-items-center justify-content-center"
								th:if="${p.imagenUrl == null}">
								<i class="bi bi-box-seam fs-1 opacity-50"></i>
							</div>
						</div>
						<div class="card-body d-flex flex-column p-4">
							<div class="small text-muted text-uppercase fw-semibold mb-1 ts-label-sm"
								th:text="${p.marca}"></div>
							<div class="fw-semibold mb-2 flex-grow-1" th:text="${p.nombre}"></div>
							<div class="d-flex flex-wrap gap-1 mb-2">
								<span class="badge rounded-pill bg-primary-subtle text-primary-emphasis"
									th:if="${p.refurbished}">Reacondicionado</span>
								<span class="badge rounded-pill bg-success-subtle text-success-emphasis"
									th:if="${p.nivelStock.name() == 'DISPONIBLE'}">En stock</span>
								<span class="badge rounded-pill bg-warning-subtle text-warning-emphasis"
									th:if="${p.nivelStock.name() == 'BAJO'}">
									Pocas (<span th:text="${p.stock}"></span>)
								</span>
								<span class="badge rounded-pill bg-danger-subtle text-danger-emphasis"
									th:if="${p.nivelStock.name() == 'AGOTADO'}">Agotado</span>
							</div>
							<div class="d-flex align-items-center gap-1 mb-2">
								<i class="bi bi-patch-check small text-muted"></i>
								<span class="text-muted small">
									Garantía <span th:text="${p.garantiaMeses}"></span> meses
								</span>
							</div>
							<div class="d-flex align-items-center justify-content-between mt-auto">
								<div class="fw-bold fs-5"
									th:text="${#numbers.formatDecimal(p.precio,1,'POINT',2,'COMMA')} + ' €'"></div>
								<!-- onclick stopPropagation evita que el click abra el modal -->
								<!-- stopPropagation: el click en "+" no abre el modal -->
								<a th:href="@{/carrito/anadir/{id}(id=${p.id})}"
									class="btn btn-dark btn-sm rounded-pill"
									th:classappend="${p.nivelStock.name() == 'AGOTADO'} ? 'disabled'"
									th:title="${p.nivelStock.name() == 'AGOTADO'} ? 'Sin stock' : 'Añadir al carrito'"
									onclick="event.stopPropagation();">
									<i class="bi bi-bag-plus"></i>
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="text-center py-5 d-none" id="noResults">
				<i class="bi bi-search fs-1 text-secondary opacity-25 d-block mb-3"></i>
				<p class="fw-semibold mb-1">Sin resultados</p>
				<p class="text-muted small mb-0">Prueba con otro término de búsqueda</p>
			</div>
		</div>
	</main>


	<!-- Modal de detalle del producto con selector de cantidad -->
	<div class="modal fade" id="productoModal" tabindex="-1" aria-labelledby="productoModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content border-0 rounded-4 shadow-lg">

				<div class="modal-header border-0 pb-0">
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
				</div>

				<div class="modal-body p-4 p-md-5 pt-0">
					<div class="row g-4 align-items-center">

						<!-- Imagen -->
						<div class="col-md-6">
							<div class="ratio ratio-1x1 bg-light rounded-4 overflow-hidden">
								<img id="modalImg" class="object-fit-contain p-4" src="" alt="" />
							</div>
						</div>

						<!-- Información -->
						<div class="col-md-6 d-flex flex-column">
							<div class="small text-muted text-uppercase fw-semibold mb-1 ts-label-sm"
								id="modalMarca">Marca</div>
							<h3 class="fw-bold mb-3" id="modalNombre">Nombre del producto</h3>

							<!-- Badges (solo el aplicable se muestra) -->
							<div class="d-flex flex-wrap gap-1 mb-3">
								<span id="modalBadgeRefurbished"
									class="badge rounded-pill bg-primary-subtle text-primary-emphasis d-none">
									Reacondicionado
								</span>
								<span id="modalBadgeEnStock"
									class="badge rounded-pill bg-success-subtle text-success-emphasis d-none">
									En stock
								</span>
								<span id="modalBadgePocas"
									class="badge rounded-pill bg-warning-subtle text-warning-emphasis d-none">
									Pocas unidades
								</span>
								<span id="modalBadgeAgotado"
									class="badge rounded-pill bg-danger-subtle text-danger-emphasis d-none">
									Agotado
								</span>
							</div>

							<div class="d-flex align-items-center gap-1 mb-2">
								<i class="bi bi-patch-check small text-muted"></i>
								<span class="text-muted small">
									Garantía <span id="modalGarantia">0</span> meses
								</span>
							</div>

							<div class="d-flex align-items-center gap-1 mb-4">
								<i class="bi bi-box-seam small text-muted"></i>
								<span class="text-muted small">
									<span id="modalStock">0</span> uds. disponibles
								</span>
							</div>

							<div class="fw-bold fs-2 mb-4" id="modalPrecio">0,00 €</div>

							<!-- Formulario GET (evita CSRF). La cantidad va como query param. -->
							<form id="modalForm" method="get" action="">
								<label class="form-label small fw-semibold text-muted text-uppercase ts-label-sm">
									Cantidad
								</label>
								<div class="input-group mb-3" style="max-width: 180px;">
									<button class="btn btn-outline-secondary" type="button" id="btnMenos">
										<i class="bi bi-dash"></i>
									</button>
									<input type="number" name="cantidad" id="modalCantidad"
										   class="form-control text-center"
										   value="1" min="1" max="99" required />
									<button class="btn btn-outline-secondary" type="button" id="btnMas">
										<i class="bi bi-plus"></i>
									</button>
								</div>

								<button type="submit" id="modalBtnAnadir"
										class="btn btn-dark rounded-pill w-100 py-2">
									<i class="bi bi-bag-plus me-1"></i>Añadir al carrito
								</button>
							</form>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<script th:src="@{/js/catalogo.js}" defer></script>

</body>

</html>
