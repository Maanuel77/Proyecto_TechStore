<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Pedido confirmado — TechStore', null)}"></head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<main>
		<div class="container py-5">
			<div class="row justify-content-center">
				<div class="col-md-8 col-lg-6">

					<!-- Banner de éxito -->
					<div class="text-center mb-4">
						<div class="d-inline-flex align-items-center justify-content-center
                                    bg-success bg-opacity-10 rounded-circle mb-3"
							style="width:72px; height:72px;">
							<i class="bi bi-bag-check-fill text-success fs-2"></i>
						</div>
						<h1 class="fw-bold fs-3 mb-1">¡Pedido confirmado!</h1>
						<p class="text-muted small mb-0">
							Fecha: <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
							&nbsp;·&nbsp;
							Ref: <span class="fw-semibold"
								th:text="'TS-' + ${#strings.toUpperCase(#strings.randomAlphanumeric(8))}"></span>
						</p>
					</div>

					<!-- Detalle del pedido -->
					<div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
						<div class="px-4 py-3 border-bottom">
							<h6 class="fw-semibold mb-0">Detalle del pedido</h6>
						</div>
						<table class="table table-hover align-middle mb-0">
							<thead class="table-light">
								<tr>
									<th class="ts-th px-4">Producto</th>
									<th class="ts-th text-center">Cant.</th>
									<th class="ts-th text-end pe-4">Subtotal</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="entry : ${items}">
									<td class="px-4">
										<div class="fw-semibold small" th:text="${entry.value.nombre}"></div>
										<div th:if="${entry.value.garantiaExtendida}"
											class="text-success small">
											<i class="bi bi-patch-check-fill me-1"></i>Garantía extendida incluida
										</div>
									</td>
									<td class="text-center">
										<span class="badge bg-secondary rounded-pill"
											th:text="${entry.value.cantidad}"></span>
									</td>
									<td class="text-end pe-4 fw-semibold"
										th:text="${#numbers.formatDecimal(entry.value.subtotal + entry.value.costeGarantia,1,'POINT',2,'COMMA')} + ' €'">
									</td>
								</tr>
							</tbody>
							<tfoot class="table-light">
								<tr>
									<td colspan="2" class="px-4 fw-bold">Total</td>
									<td class="text-end pe-4 fw-bold fs-5"
										th:text="${#numbers.formatDecimal(total,1,'POINT',2,'COMMA')} + ' €'">
									</td>
								</tr>
							</tfoot>
						</table>
					</div>

					<!-- Acciones -->
					<div class="d-flex gap-3 justify-content-center">
						<a th:href="@{/catalogo}" class="btn btn-dark rounded-pill px-4">
							<i class="bi bi-arrow-left me-1"></i>Seguir comprando
						</a>
						<button onclick="window.print()" class="btn btn-outline-secondary rounded-pill px-4">
							<i class="bi bi-printer me-1"></i>Imprimir
						</button>
					</div>

				</div>
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
