<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Mi perfil — TechStore', null)}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <div class="bg-white border-bottom py-4 mb-4">
            <div class="container">
                <h1 class="fw-bold fs-3 mb-0">Mi perfil</h1>
                <p class="text-muted small mb-0">Información de tu cuenta</p>
            </div>
        </div>

        <div class="container pb-5">
            <div class="row g-4 justify-content-center">

                <!-- Datos del usuario -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-semibold mb-4">
                            <i class="bi bi-person-circle me-2"></i>Datos personales
                        </h5>

                        <!-- Alerta contraseña cambiada -->
                        <div class="alert alert-success border-0 rounded-3 small py-2"
                             th:if="${passwordCambiado}">
                            <i class="bi bi-check-circle me-1"></i>
                            Contraseña actualizada correctamente.
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted text-uppercase">
                                Usuario
                            </label>
                            <input type="text" class="form-control" readonly
                                   th:value="${usuario.username}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted text-uppercase">
                                Nombre completo
                            </label>
                            <input type="text" class="form-control" readonly
                                   th:value="${usuario.fullname}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted text-uppercase">
                                Email
                            </label>
                            <input type="email" class="form-control" readonly
                                   th:value="${usuario.email}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted text-uppercase">
                                Teléfono
                            </label>
                            <input type="text" class="form-control" readonly
                                   th:value="${usuario.telefono != null} ? ${usuario.telefono} : '—'" />
                        </div>

                        <div>
                            <label class="form-label small fw-semibold text-muted text-uppercase">
                                Rol
                            </label>
                            <input type="text" class="form-control" readonly
                                   th:value="${usuario.role}" />
                        </div>
                    </div>
                </div>

                <!-- Cambiar contraseña -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-semibold mb-4">
                            <i class="bi bi-lock me-2"></i>Cambiar contraseña
                        </h5>

                        <form th:action="@{/perfil/cambiar-password}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-muted text-uppercase">
                                    Nueva contraseña
                                </label>
                                <input type="password" class="form-control"
                                       name="nuevaPassword" required minlength="6" />
                            </div>
                            <button type="submit" class="btn btn-dark rounded-pill w-100 py-2">
                                <i class="bi bi-shield-lock me-1"></i>Guardar contraseña
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
