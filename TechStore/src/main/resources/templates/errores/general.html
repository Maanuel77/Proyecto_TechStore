<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Ups! Ha ocurrido un error — TechStore', null)}"></head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main>
        <div class="container py-5" style="max-width: 640px;">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                <div class="card-header bg-danger text-white d-flex align-items-center py-3 px-4">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
                    <h4 class="mb-0 fw-semibold" th:text="${errorTitulo}">Título del Error</h4>
                </div>

                <div class="card-body text-center p-4 p-md-5">
                    <p class="fs-5 my-3" th:text="${errorMensaje}">Detalle explícito del problema ocurrido.</p>
                    <hr class="my-4">
                    <p class="text-muted small mb-3">Código de Control Interno — TechStore</p>
                    <a th:href="@{/}" class="btn btn-dark rounded-pill px-4 py-2">
                        <i class="bi bi-house me-1"></i>Volver al Inicio
                    </a>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
