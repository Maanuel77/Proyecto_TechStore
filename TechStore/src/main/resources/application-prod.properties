# Perfil PROD: configuracion endurecida para entornos publicos.
#
# Se activa con -Dspring.profiles.active=prod (o variable de entorno
# SPRING_PROFILES_ACTIVE=prod).

# Consola H2 DESHABILITADA en produccion (acceso anonimo a la BD).
spring.h2.console.enabled=false

# No loggear queries SQL (filtraria hashes BCrypt, datos personales...).
spring.jpa.show-sql=false

# Nunca loggear codigos 2FA en consola.
techstore.mail.log-code=false
